name: Build RKNN Model

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
<Steps>
  <Step title="Build and Export Model" subtitle="Ubuntu Runner">
    ```yaml
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install RKNN Toolkit2
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install rknn-toolkit2

      - name: Run Conversion Script
        run: |
          # Replace 'model.onnx' with your actual ONNX model filename
          python convert.py model.onnx output.rknn

      - name: Upload RKNN Artifact
        uses: actions/upload-artifact@v3
        with:
          name: compiled-rknn-model
          path: output.rknn
    ```
  </Step>
</Steps>
