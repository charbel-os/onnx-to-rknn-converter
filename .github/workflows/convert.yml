name: Production Build INT8 YOLOv8s RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Disk and Swap Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096  # Allocates 4GB of swap space to prevent memory crashes
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn onnx-simplifier "onnx<1.19" ultralytics rknn-toolkit2

      - name: Export YOLOv8s to ONNX
        run: |
            python -c "
            from ultralytics import YOLO
            model = YOLO('yolov8s.pt')
            model.export(format='onnx', imgsz=640, simplify=True)
            "

      - name: Verify Calibration Dataset Structure
        run: |
            python -c "
            import os
            if not os.path.exists('dataset.txt'):
                raise FileNotFoundError('dataset.txt not found in workspace root!')
            if not os.path.exists('cocosubset'):
                raise FileNotFoundError('cocosubset folder not found in workspace root!')
            
            with open('dataset.txt', 'r') as f:
                lines = f.readlines()
            print(f'Structure check passed: dataset.txt contains {len(lines)} references.')
            "

      - name: Verify Calibration Images Integrity (OpenCV Check)
        run: |
            python -c "
            import cv2
            import os

            with open('dataset.txt', 'r') as f:
                lines = [line.strip() for line in f if line.strip()]

            print(f'Validating integrity of {len(lines)} calibration images...')
            for idx, img_path in enumerate(lines):
                if not os.path.exists(img_path):
                    raise FileNotFoundError(f'Calibration image not found on disk: {img_path}')
                
                img = cv2.imread(img_path)
                if img is None:
                    raise ValueError(f'Failed to decode image at index {idx}: {img_path}. File may be corrupted.')

            print('All calibration images successfully verified and loaded via OpenCV!')
            "

      - name: Run RKNN Conversion Script
        run: |
            python convert.py

      - name: Organize Output Directory
        run: |
            mkdir -p yolov8s_rknn_model
            mv yolov8s_640_int8.rknn yolov8s_rknn_model/
            ls -la yolov8s_rknn_model/

      - name: Upload Production INT8 RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov8s-rknn-int8-prod
            path: yolov8s_rknn_model/
            if-no-files-found: error
