name: Convert YOLOv5s ONNX to RKNN (FP16)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx ultralytics
          pip install rknn-toolkit2

      - name: Export YOLOv5su ONNX
        run: |
          # Export YOLOv5 (auto-mapped to yolov5su) to ONNX with static shape
          python3 -c "
          from ultralytics import YOLO
          model = YOLO('yolov5s.pt')
          model.export(format='onnx', imgsz=640, simplify=True, dynamic=False)
          "
          
          # Verify the correct filename (yolov5su.onnx) exists in the root directory
          if [ -f "yolov5su.onnx" ]; then
            echo "SUCCESS: yolov5su.onnx found."
          else
            echo "ERROR: yolov5su.onnx not found after export!"
            exit 1
          fi

      - name: Run FP16 Model Conversion
        run: |
          # If your convert.py script expects a quantize flag, make sure it's set to False or omitted for FP16
          python3 convert.py yolov5su.onnx output.rknn rk3588

      - name: Upload Generated RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov5s-fp16-rknn-model
          path: output.rknn
