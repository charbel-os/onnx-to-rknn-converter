name: Build FP16 RKNN Model

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download ONNX Model from Hugging Face
        run: |
          wget -O ssd-mobilenet-v2.onnx "https://huggingface.co/Kalray/ssd-mobilenet-v2/resolve/main/ssd-mobilenet-v2.onnx"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install RKNN Toolkit
        run: |
          python -m pip install --upgrade pip
          pip install rknn-toolkit2

      - name: Run Conversion Script
        run: python convert.py

      - name: Upload RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssd-mobilenet-v2-fp16
          path: ssd_mobilenet_v2_fp16.rknn
