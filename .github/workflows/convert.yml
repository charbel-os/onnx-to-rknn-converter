name: Build Hybrid YOLOv8s RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics opencv-python "onnx<1.19" rknn-toolkit2

      - name: Create Calibration Dataset
        run: |
          python3 -c "
          import cv2, numpy as np, os
          os.makedirs('calib_images', exist_ok=True)
          with open('dataset640.txt', 'w') as f:
              for i in range(20):
                  img_path = f'calib_images/img_{i}.jpg'
                  # Generate random representative sample image frames (640x640)
                  dummy_img = np.random.randint(0, 255, (640, 640, 3), dtype=np.uint8)
                  cv2.imwrite(img_path, dummy_img)
                  f.write(os.path.abspath(img_path) + '\n')
          print('Successfully generated 20 calibration images and dataset640.txt')
          "

      - name: Run Hybrid Conversion and Quantization Script
        run: python convert.py

      - name: Upload Hybrid RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-img640-hybrid-rknn
          path: yolov8s_640_hybrid.rknn
          if-no-files-found: error
