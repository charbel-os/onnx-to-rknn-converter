name: Convert YOLOv8s ONNX to RKNN (FP16)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest # Note: rknn-toolkit2 dependencies usually run best in specific environments, or you can use a pre-built docker container. 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' # RKNN-Toolkit2 typically requires Python 3.8 or 3.9 depending on version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx
          # Install rknn-toolkit2 matching your target version (e.g., from Rockchip's official wheel or index)
          pip install rknn-toolkit2

      - name: Run FP16 Model Conversion
        run: |
          python3 convert.py yolov8s.onnx output.rknn rk3588

      - name: Upload Generated RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-rknn-model
          path: output2.rknn
