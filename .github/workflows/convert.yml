name: Train and Export YOLOv8s INT8 RKNN Model

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics "onnx<1.19" rknn-toolkit2

      - name: Run Conversion and INT8 Quantization Script
        run: python convert.py

      - name: Upload INT8 RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov8m-img416-int8-rknn
            path: yolov8m_416_int8.rknn
            if-no-files-found: error # <--- This will throw an error instead of hiding it
