name: Build INT8 YOLOv8n RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn onnx-simplifier "onnx<1.19" ultralytics rknn-toolkit2

      - name: Download Sample Dataset & Create YAML Config
        run: |
          python -c "
          import urllib.request, zipfile, os

          print('Downloading COCO128 dataset for calibration...')
          url = 'https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip'
          urllib.request.urlretrieve(url, 'coco128.zip')

          with zipfile.ZipFile('coco128.zip', 'r') as zip_ref:
              zip_ref.extractall('.')

          yaml_content = '''
          path: coco128
          train: images/train2017
          val: images/train2017
          names:
            0: person
          '''

          with open('calib.yaml', 'w') as f:
              f.write(yaml_content)

          print('Successfully created calib.yaml configuration file.')
          "

      - name: Export YOLOv8n to INT8 RKNN
        run: |
          python -c "
          from ultralytics import YOLO
          model = YOLO('yolov8n.pt')
          model.export(
              format='rknn',
              imgsz=640,
              simplify=True,
              quantize=8,
              data='calib.yaml',
              name='rk3588'
          )
          "

      - name: Inspect Export Directory (Debug)
        run: |
            ls -la yolo8n_rknn_model/

      - name: Upload INT8 RKNN Model Folder Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov8n-rknn-int8
            path: yolo8n_rknn_model/
            if-no-files-found: error
