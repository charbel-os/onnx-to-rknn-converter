name: Convert YOLOv8s ONNX to RKNN (INT8)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx ultralytics
          pip install rknn-toolkit2

      - name: Download YOLOv8s ONNX Model & Prepare Calibration Dataset (300+ Images)
        run: |
          # Export YOLOv8s to ONNX with static shape (dynamic=False is critical for RKNN INT8)
          python3 -c "from ultralytics import YOLO; model = YOLO('yolov8s.pt'); model.export(format='onnx', imgsz=640, simplify=True, dynamic=False)"
          
          if [ -f "yolov8s.onnx" ]; then
            echo "YOLOv8s ONNX successfully exported."
          fi

          # Automatically download and extract 300+ real-world calibration frames from a public video stream
          python3 -c "
          import cv2, os

          os.makedirs('calib_images', exist_ok=True)
          video_url = 'https://github.com/intel-iot-devkit/sample-videos/raw/master/car-detection.mp4'
          
          print(f'Downloading and extracting frames from: {video_url}')
          cap = cv2.VideoCapture(video_url)
          
          count = 0
          while cap.isOpened() and count < 320:
              ret, frame = cap.read()
              if not ret:
                  break
              # Resize to model input specification (640x640)
              frame_resized = cv2.resize(frame, (640, 640))
              cv2.imwrite(f'calib_images/img_{count:03d}.jpg', frame_resized)
              count += 1
          
          cap.release()
          print(f'Successfully extracted {count} calibration images.')

          # Write dataset.txt with absolute paths for the RKNN toolkit
          with open('dataset.txt', 'w') as f:
              for i in range(count):
                  abs_path = os.path.abspath(f'calib_images/img_{i:03d}.jpg')
                  f.write(f'{abs_path}\n')
          "

      - name: Run INT8 Model Conversion
        run: |
          python3 convert.py yolov8s.onnx output.rknn rk3588

      - name: Upload Generated RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-int8-rknn-model
          path: output.rknn
