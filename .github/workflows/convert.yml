name: Build Hybrid YOLOv8s RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics opencv-python "onnx<1.19" rknn-toolkit2

      - name: Run Hybrid Conversion and Quantization Script
        run: python convert.py

      - name: Upload Hybrid RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov8s-img640-hybrid-rknn
            path: yolov8s_640_hybrid.rknn
            if-no-files-found: error
