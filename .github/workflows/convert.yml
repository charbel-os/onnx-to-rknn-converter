name: Build INT8 YOLOv8n-seg RKNN Model (RK3588 Manual)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn onnx-simplifier "onnx<1.19" ultralytics rknn-toolkit2

      - name: Download Sample Dataset
        run: |
          python -c "
          import urllib.request, zipfile

          print('Downloading COCO128 dataset for calibration...')
          url = 'https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip'
          urllib.request.urlretrieve(url, 'coco128.zip')

          with zipfile.ZipFile('coco128.zip', 'r') as zip_ref:
              zip_ref.extractall('.')

          print('Successfully extracted COCO128 dataset.')
          "

      - name: Run Manual YOLOv8n-seg INT8 RKNN Conversion Script
        run: python convert.py

      - name: Inspect Output File (Debug)
        run: |
          ls -la yolov8n_seg_640_int8.rknn

      - name: Upload INT8 RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov8n-seg-int8-rknn
            path: yolov8n_seg_640_int8.rknn
            if-no-files-found: error
