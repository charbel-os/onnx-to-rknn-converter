name: Build INT8 YOLOv8s RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn onnx-simplifier "onnx<1.19" ultralytics rknn-toolkit2

      - name: Export YOLOv8s to INT8 RKNN
        run: |
            python -c "
            from ultralytics import YOLO
            
            # Load YOLOv8s model
            model = YOLO('yolov8s.pt')
            
            # Export to INT8 RKNN format using the repository's dataset configuration
            model.export(
                format='rknn',
                imgsz=640,
                simplify=True,
                quantize=8,
                data='dataset.txt',
                name='rk3588'
            )
            "

      - name: Inspect Export Directory (Debug)
        run: |
            ls -la yolov8s_rknn_model/

      - name: Upload INT8 RKNN Model Folder Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov8s-rknn-int8
            path: yolov8s_rknn_model/
            if-no-files-found: error
