name: Convert YOLOv8s Hybrid RKNN (INT8/FP16 Hybrid)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx ultralytics
          pip install rknn-toolkit2

      - name: Prepare Calibration Dataset & Export ONNX
        run: |
          python3 -c "from ultralytics import YOLO; model = YOLO('yolov8s.pt'); model.export(format='onnx', imgsz=640, simplify=True, dynamic=False)"
          
          python3 -c "
          import cv2, os
          os.makedirs('calib_images', exist_ok=True)
          video_url = 'https://github.com/intel-iot-devkit/sample-videos/raw/master/car-detection.mp4'
          cap = cv2.VideoCapture(video_url)
          count = 0
          while cap.isOpened() and count < 320:
              ret, frame = cap.read()
              if not ret: break
              frame_resized = cv2.resize(frame, (640, 640))
              cv2.imwrite(f'calib_images/img_{count:03d}.jpg', frame_resized)
              count += 1
          cap.release()
          with open('dataset.txt', 'w') as f:
              for i in range(count):
                  f.write(f'{os.path.abspath(f\"calib_images/img_{i:03d}.jpg\")}\n')
          "

      - name: Run Complete Hybrid Quantization Pipeline
        run: |
          python3 -c "
          import sys
          from rknn.api import RKNN

          rknn = RKNN(verbose=False)
          rknn.config(mean_values=[[0, 0, 0]], std_values=[[255, 255, 255]], target_platform='rk3588')

          print('--> Loading ONNX model...')
          if rknn.load_onnx(model='yolov8s.onnx') != 0:
              print('Failed to load ONNX')
              sys.exit(1)

          print('--> Building initial quantized model...')
          if rknn.build(do_quantization=True, dataset='dataset.txt') != 0:
              print('Build failed')
              sys.exit(1)

          # Export to disk first so step 1 finds the context
          print('--> Exporting intermediate rknn...')
          rknn.export_rknn('output.rknn')

          print('--> Generating hybrid quantization config...')
          cfg_path = 'output.rknn.quantization.cfg'
          if rknn.hybrid_quantization_step1(cfg_path) != 0:
              print('Hybrid step 1 failed')
              sys.exit(1)
          print('Step 1 successful!')
          "

      - name: Force Output Layers to FP16 and Run Step 2
        run: |
          python3 -c "
          cfg_file = 'output.rknn.quantization.cfg'
          try:
              with open(cfg_file, 'r') as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f'Error: {cfg_file} missing!')
              exit(1)

          new_lines = []
          for line in lines:
              if '[custom_quantize_layers]' in line or 'layer_name' in line:
                  new_lines.append(line)
              elif 'quantize =' in line:
                  new_lines.append('quantize = FP16\n')
              else:
                  new_lines.append(line)
          
          with open(cfg_file, 'w') as f:
              f.writelines(new_lines)
          print('Updated config to force FP16 on output layers.')
          "

          python3 -c "
          from rknn.api import RKNN
          rknn = RKNN()
          ret = rknn.hybrid_quantization_step2(
              model_input='yolov8s.onnx',
              data='dataset.txt',
              hybrid_quant_cfg='output.rknn.quantization.cfg',
              output_rknn_path='output.rknn'
          )
          print('Hybrid build step 2 finished with exit code:', ret)
          if ret != 0:
              exit(1)
          "

      - name: Upload Hybrid RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-hybrid-rknn-model
          path: output.rknn
