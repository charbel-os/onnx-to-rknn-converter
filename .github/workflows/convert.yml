name: Convert YOLOv8s ONNX to RKNN (INT8)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx ultralytics
          pip install rknn-toolkit2

      - name: Download YOLOv8s ONNX Model & Prepare Calibration Data
        run: |
          # Download official YOLOv8s model and export to onnx if not present in repo
          python3 -c "from ultralytics import YOLO; model = YOLO('yolov8s.pt'); model.export(format='onnx', imgsz=640, simplify=True)"
          
          # Rename exported file to match expected default if necessary
          if [ -f "yolov8s.onnx" ]; then
            echo "YOLOv8s ONNX ready."
          fi

          # Create a dummy calibration image (640x640) required for INT8 quantization
          python3 -c "
          import cv2, numpy as np
          img = np.random.randint(0, 255, (640, 640, 3), dtype=np.uint8)
          cv2.imwrite('calib_img.jpg', img)
          with open('dataset.txt', 'w') as f:
              f.write('calib_img.jpg\n')
          "

      - name: Run INT8 Model Conversion
        run: |
          python3 convert.py yolov8s.onnx output.rknn rk3588

      - name: Upload Generated RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-int8-rknn-model
          path: output.rknn
