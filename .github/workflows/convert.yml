name: Build FP16 YOLOv7-tiny RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Official YOLOv7 Repository
        run: git clone https://github.com/WongKinYiu/yolov7.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cpu
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn "onnx<1.19" rknn-toolkit2

      - name: Run FP16 Conversion Script
        run: python convert.py

      - name: Upload FP16 RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov7-tiny-rknn-fp16
            path: yolov7-tiny_416_fp16.rknn
            if-no-files-found: error
