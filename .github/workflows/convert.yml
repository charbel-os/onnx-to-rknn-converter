name: Build FP16 YOLOv11n RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn onnx-simplifier "onnx<1.19" ultralytics rknn-toolkit2

      - name: Export YOLOv11n to ONNX
        run: |
            # Ultralytics auto-downloads 'yolov11n.pt' if it isn't present locally
            python -c "from ultralytics import YOLO; model = YOLO('yolov11n.pt'); model.export(format='onnx', imgsz=640, simplify=True)"
            # Ultralytics saves 'yolov11n.onnx' directly in the root directory.

      - name: Run RKNN FP16 Conversion Script
        run: python convert.py

      - name: Upload FP16 RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov11n-rknn-fp16
            path: yolov11n_640_fp16.rknn
            if-no-files-found: error
