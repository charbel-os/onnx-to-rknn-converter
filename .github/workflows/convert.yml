name: Convert YOLOv5s ONNX to RKNN (Pure INT8)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx ultralytics
          pip install rknn-toolkit2

      - name: Prepare Calibration Dataset & Export YOLOv5su ONNX
        run: |
          # Export YOLOv5 (auto-mapped to yolov5su) to ONNX with static shape
          python3 -c "
          from ultralytics import YOLO
          model = YOLO('yolov5s.pt')
          model.export(format='onnx', imgsz=640, simplify=True, dynamic=False)
          "
          
          # Verify the correct filename (yolov5su.onnx) exists in the root directory
          if [ -f "yolov5su.onnx" ]; then
            echo "SUCCESS: yolov5su.onnx found."
          else
            echo "ERROR: yolov5su.onnx not found after export!"
            exit 1
          fi

          # Automatically download and extract 320+ calibration frames from GitHub source video
          python3 -c "
          import cv2, os
          os.makedirs('calib_images', exist_ok=True)
          video_url = 'https://github.com/intel-iot-devkit/sample-videos/raw/master/car-detection.mp4'
          cap = cv2.VideoCapture(video_url)
          count = 0
          while cap.isOpened() and count < 320:
              ret, frame = cap.read()
              if not ret: break
              frame_resized = cv2.resize(frame, (640, 640))
              cv2.imwrite(f'calib_images/img_{count:03d}.jpg', frame_resized)
              count += 1
          cap.release()
          with open('dataset.txt', 'w') as f:
              for i in range(count):
                  f.write(f'{os.path.abspath(f\"calib_images/img_{i:03d}.jpg\")}\n')
          "

      - name: Run Pure INT8 Model Conversion
        run: |
          python3 convert.py yolov5su.onnx output.rknn rk3588

      - name: Upload Generated RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov5s-int8-rknn-model
          path: output.rknn
