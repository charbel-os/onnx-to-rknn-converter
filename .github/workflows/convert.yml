name: Build FP16 YOLOv7s RKNN Model (RK3588)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            # Explicitly install matching torch and torchvision binaries (CPU version is sufficient for ONNX export)
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            # Install remaining required packages safely
            pip install opencv-python pandas requests pyyaml scipy tqdm matplotlib seaborn "onnx<1.19" rknn-toolkit2

      - name: Run FP16 Conversion Script
        run: python convert.py

      - name: Upload FP16 RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
            name: yolov7s-rknn-fp16
            path: yolov7s_416_fp16.rknn
            if-no-files-found: error
