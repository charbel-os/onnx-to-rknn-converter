name: Convert YOLOv8s Hybrid RKNN (INT8/FP16 Hybrid)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python onnx ultralytics
          pip install rknn-toolkit2

      - name: Prepare Calibration Dataset & Export ONNX
        run: |
          python3 -c "from ultralytics import YOLO; model = YOLO('yolov8s.pt'); model.export(format='onnx', imgsz=640, simplify=True, dynamic=False)"
          
          python3 -c "
          import cv2, os
          os.makedirs('calib_images', exist_ok=True)
          video_url = 'https://github.com/intel-iot-devkit/sample-videos/raw/master/car-detection.mp4'
          cap = cv2.VideoCapture(video_url)
          count = 0
          while cap.isOpened() and count < 320:
              ret, frame = cap.read()
              if not ret: break
              frame_resized = cv2.resize(frame, (640, 640))
              cv2.imwrite(f'calib_images/img_{count:03d}.jpg', frame_resized)
              count += 1
          cap.release()
          with open('dataset.txt', 'w') as f:
              for i in range(count):
                  f.write(f'{os.path.abspath(f\"calib_images/img_{i:03d}.jpg\")}\n')
          "

      - name: Run Hybrid Quantization Step 1
        run: |
          python3 convert.py yolov8s.onnx output.rknn rk3588

      - name: Force Output Layers to FP16 in Config & Run Step 2
        run: |
          python3 -c "
          import re
          cfg_file = 'output.rknn.quantization.cfg'
          with open(cfg_file, 'r') as f:
              lines = f.readlines()

          # Force output detection nodes to float16 to prevent score collapsing
          new_lines = []
          for line in lines:
              if '[custom_quantize_layers]' in line or 'layer_name' in line:
                  new_lines.append(line)
              elif 'quantize =' in line:
                  new_lines.append('quantize = FP16\n')
              else:
                  new_lines.append(line)
          
          with open(cfg_file, 'w') as f:
              f.writelines(new_lines)
          print('Updated quantization config file to use FP16 for sensitive layers.')
          "

          python3 -c "
          from rknn.api import RKNN
          rknn = RKNN()
          ret = rknn.hybrid_quantization_step2(
              model_input='yolov8s.onnx',
              data='dataset.txt',
              hybrid_quant_cfg='output.rknn.quantization.cfg',
              output_rknn_path='output.rknn'
          )
          print('Hybrid build finished with exit code:', ret)
          if ret != 0:
              exit(1)
          "

      - name: Upload Hybrid RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-hybrid-rknn-model
          path: output.rknn
