name: Build YOLOv8n FP16 RKNN Model

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics "onnx<1.19" rknn-toolkit2

      - name: Export YOLOv8n.pt to ONNX
        run: |
          python -c "from ultralytics import YOLO; model = YOLO('yolov8n.pt'); model.export(format='onnx', imgsz=640, simplify=True)"

      - name: Run Conversion Script
        run: python convert.py

      - name: Upload RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8n-fp16-rknn
          path: yolov8n_fp16.rknn
