name: Train and Export YOLOv8s RKNN Model

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rknn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics "onnx<1.19" rknn-toolkit2

      - name: Run Training and Export Script
        run: python convert.py

      - name: Upload RKNN Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov8s-img412-fp16-rknn
          path: yolov8s_412_fp16.rknn
